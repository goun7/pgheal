name: Release

on:
  push:
    branches: [main, master]

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    permissions:
      contents: write # changesets version PR
      pull-requests: write
      id-token: write # npm provenance (required)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles an npm client that supports OIDC trusted publishing;
          # the step below pins npm >= 11.5.1 regardless of the bundled version
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          # publishing uses npm trusted publishing (OIDC, id-token: write above) —
          # no NPM_TOKEN secret needed after the package + publisher are configured
          # on npmjs.com (org/user goun7, repo pgheal, workflow release.yml)

      - run: npm install -g npm@^11 # trusted publishing needs npm >= 11.5.1
      - run: npm ci

      - name: Typecheck + tests + build
        run: |
          npm run typecheck
          npm test -- --exclude test/db-e2e.integration.test.ts
          npm run build

      # Real-DB E2E before publishing — never ship an unproven robot
      - name: Real-database E2E (Postgres 18 + HypoPG)
        run: npx vitest run test/db-e2e.integration.test.ts
        timeout-minutes: 15

      - name: Create version PR or publish
        if: env.HAS_NPM_TOKEN == 'true'
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          NODE_ENV: "production"

      - name: Skipped (no NPM_TOKEN)
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::notice::NPM_TOKEN secret is not set — release skipped. Add it (Settings → Secrets → Actions) to publish to npm."

name: License renewal reminders

# Vendor hygiene: every Monday, audit the issued-keys ledger and open a
# reminder issue for keys expiring soon. The ledger (pgheal-licenses.ndjson,
# gitignored) is appended automatically by `pgheal license issue` at every
# sale/renewal — zero manual bookkeeping.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install -g npm@^11 && npm ci && npm run build

      - name: Ensure vendor-task label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create "vendor-task" --color "5319e7" --description "Maintainer task from automation" 2>/dev/null || true

      - name: Audit the ledger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f pgheal-licenses.ndjson ]; then
            echo "::notice::no license ledger yet — nothing to audit"
            exit 0
          fi
          OUT=$(node dist/index.js license audit --key pgheal-licenses.ndjson)
          echo "$OUT"
          if echo "$OUT" | grep -qE "❌|⏳"; then
            {
              echo "Weekly audit output:"
              echo ""
              echo '```'
              echo "$OUT"
              echo '```'
              echo ""
              echo "Action: contact the customer for renewal (they can also self-serve: new"
              echo "payment + \`paid\` label on their issue → fresh key is issued automatically)."
            } > body.md
            gh issue create \
              --title "License hygiene: expiring/expired keys need attention" \
              --body-file body.md \
              --label "vendor-task" || \
            gh issue create --title "License hygiene: expiring/expired keys" --body "$OUT"
          else
            echo "all licenses healthy"
          fi

# Financial support

pgHeal is free, open-source software (MIT). If it saves your team DBA hours,
you can support development:

- **GitHub Sponsors:** https://github.com/sponsors/goun7

Commercial licensing (Team plan: multi-repo `workspace`, priority support) is
sold as offline-verifiable HMAC license keys — see the `workspace` command in
the README. Sponsors at the Team tier get the license included.

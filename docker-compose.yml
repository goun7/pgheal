services:
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    environment:
      POSTGRES_USER: pgheal
      POSTGRES_PASSWORD: pgheal
      POSTGRES_DB: demo
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements
               -c pg_stat_statements.track=all
    volumes:
      - ./docker/demo/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgheal -d demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  pgheal:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pgheal:pgheal@db:5432/demo
      PGHEAL_MIN_TOTAL_MS: "0"
    # dry-run scan against the demo DB; report printed to stdout
    command: ["scan", "--top", "3"]
